# Local only. The credentials below are development placeholders.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: access
      POSTGRES_PASSWORD: access
      POSTGRES_DB: access
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access -d access"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      APP_REVISION: compose
      DATABASE_URL: postgresql://access:access@db:5432/access
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
