openapi: "3.0.3"
info:
  title: spacey-access
  version: "0.1.0"
  description: >
    Access service for spacey. Manages access codes and room check-in/check-out.
    Purchase owns the paid check; Access never reads the bookings table.

paths:
  /health:
    get:
      summary: Service and database health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  revision:
                    type: string
        "503":
          description: Database unreachable

  /openapi.yaml:
    get:
      summary: This contract
      responses:
        "200":
          description: YAML document

  /bookings/{booking_id}/access:
    post:
      summary: Grant access for a paid booking (Purchase only)
      description: >
        Idempotent — returns the same code on repeat. Purchase must have
        confirmed payment before calling this.
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_id, start_time, end_time]
              properties:
                space_id:
                  type: integer
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Access granted (new)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRecord"
        "200":
          description: Access already existed (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      summary: Read access status (never returns the code)
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Move the booking interval and expiry (Purchase only)
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_time, end_time]
              properties:
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
                expires_at:
                  type: string
                  format: date-time
                  description: Defaults to end_time if omitted
      responses:
        "200":
          description: Interval updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /bookings/{booking_id}/access/remove:
    post:
      summary: Remove access on cancellation (Purchase only)
      description: Idempotent — safe to retry.
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Access removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: integer
                  status:
                    type: string
                    example: removed
                  removed_at:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{booking_id}/check-in:
    post:
      summary: Check in — present the access code (Frontend only)
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_code]
              properties:
                access_code:
                  type: string
                  example: "8754e726"
      responses:
        "200":
          description: Checked in
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: integer
                  status:
                    type: string
                    example: used
                  checked_in_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Code does not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /bookings/{booking_id}/check-out:
    post:
      summary: Check out — release the room (Frontend only)
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Checked out
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: integer
                  status:
                    type: string
                    example: available
                  checked_out_at:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  schemas:
    AccessRecord:
      type: object
      properties:
        booking_id:
          type: integer
        access_code:
          type: string
          example: "8754e726"
        status:
          type: string
          enum: [available, used, expired, removed]
        expires_at:
          type: string
          format: date-time

    AccessStatus:
      type: object
      properties:
        booking_id:
          type: integer
        status:
          type: string
          enum: [available, used, expired, removed]
        checked_in_at:
          type: string
          format: date-time
          nullable: true
        checked_out_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No access record for this booking
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State conflict (already used, removed, etc.)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              status:
                type: string