name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: access
          POSTGRES_PASSWORD: access
          POSTGRES_DB: access
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U access"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
        env:
          DATABASE_URL: postgresql://access:access@localhost:5432/access
      - name: Build and exercise the release image
        run: |
          docker build -t access-release .
          docker run -d --name access-smoke --network host \
            -e DATABASE_URL=postgresql://access:access@localhost:5432/access \
            -e APP_REVISION="${GITHUB_SHA}" access-release
          trap 'docker rm -f access-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://localhost:8000/health | \
              jq -e --arg revision "${GITHUB_SHA}" '.status == "ok" and .revision == $revision'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exercised image
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"
          docker tag access-release "${image}"
          docker push "${image}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: access-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-nomad@6e88df50dd00f3737f04fddde2bf2bd446e313dd
        with:
          version: "1.10.5"
      - name: Deploy the reviewed main revision
        env:
          GH_TOKEN: ${{ github.token }}
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          NOMAD_NAMESPACE: ${{ vars.NOMAD_NAMESPACE }}
          APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
          RUNTIME_VARIABLE: ${{ vars.RUNTIME_VARIABLE }}
          IMAGE: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          : "${NOMAD_ADDR:?}" "${NOMAD_TOKEN:?}" "${NOMAD_NAMESPACE:?}" "${APP_HOSTNAME:?}" "${RUNTIME_VARIABLE:?}" "${IMAGE:?}"
          current_revision="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${current_revision}" = "${GITHUB_SHA}"
          nomad job run \
            -var="image=${IMAGE}" -var="revision=${GITHUB_SHA}" \
            -var="namespace=${NOMAD_NAMESPACE}" -var="hostname=${APP_HOSTNAME}" \
            -var="runtime_variable=${RUNTIME_VARIABLE}" deploy/access.nomad.hcl
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "https://${APP_HOSTNAME}/health" | \
              jq -e --arg revision "${GITHUB_SHA}" '.status == "ok" and .revision == $revision'; then
              echo "Verified ${GITHUB_SHA} at https://${APP_HOSTNAME}/health" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 2
          done
          exit 1
