name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: access
          POSTGRES_PASSWORD: access
          POSTGRES_DB: access
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U access"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
        env:
          DATABASE_URL: postgresql://access:access@localhost:5432/access
      - name: Build image (no push)
        run: docker build -t spacey-access:${{ github.sha }} .
